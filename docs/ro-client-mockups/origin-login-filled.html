<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Origin login — filled</title>
<link rel="stylesheet" href="origin-flow.css">
<style>
  .login {
    right: 72px;
    top: 168px;
    width: 340px;
    padding: 28px 28px 22px;
  }
  .login .panel-title { margin-bottom: 18px; }
  .field { margin-bottom: 12px; }
  .gold-btn { margin: 16px 0 12px; }
</style>
</head>
<body>
<div class="screen">
  <div class="sun"></div>
  <div class="path"></div>
  <div class="plaza">
    <div class="house a"><div class="roof"></div></div>
    <div class="tower"><div class="clock"></div></div>
    <div class="house b"><div class="roof"></div></div>
    <div class="house c"><div class="roof"></div></div>
    <div class="house d"><div class="roof"></div></div>
    <div class="tree l"><div class="canopy"><i class="bloom" style="left:18px;top:16px"></i></div><div class="trunk"></div></div>
    <div class="tree r"><div class="canopy"><i class="bloom" style="left:28px;top:20px"></i></div><div class="trunk"></div></div>
  </div>
  <div class="crest">
    <div class="mark"></div>
    <h1>MIDGARD</h1>
    <p>ENTER THE WORLD</p>
  </div>
  <div class="panel login">
    <div class="ornament-bl"></div>
    <div class="ornament-br"></div>
    <div class="panel-title">Account Login</div>
    <div class="field">
      <div class="label">Server</div>
      <div class="select"><span>Local rAthena · 127.0.0.1</span><i class="chev"></i></div>
    </div>
    <div class="field">
      <div class="label">Account</div>
      <div class="input"><span>testaccount</span></div>
    </div>
    <div class="field">
      <div class="label">Password</div>
      <div class="input focus"><span>••••••••••</span><i class="caret"></i></div>
    </div>
    <div class="gold-btn wide">ENTER</div>
    <div class="check"><i style="background:#f6d56a;border-color:#8a6a2a"></i> Remember account</div>
  </div>
</div>
</body>
</html>

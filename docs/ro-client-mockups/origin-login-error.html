<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Origin login — error</title>
<link rel="stylesheet" href="origin-flow.css">
<style>
  .login-card { right: 56px; top: 150px; width: 340px; padding: 28px 28px 22px; }
  .login-card .panel-title { margin-bottom: 18px; }
  .field { margin-bottom: 12px; }
  .gold-btn { margin: 16px 0 12px; }
  .veil { position: absolute; inset: 0; background: rgba(20, 10, 4, 0.38); z-index: 3; }
  .modal { left: 430px; top: 236px; width: 420px; padding: 22px 24px 18px; z-index: 4; }
  .modal .panel-title { margin-bottom: 12px; }
  .modal p { font-size: 13px; line-height: 1.45; text-align: center; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="screen login">
  <div class="crest">
    <h1>MIDGARD</h1>
    <p>ENTER THE WORLD</p>
  </div>
  <div class="panel login-card">
    <div class="ornament-bl"></div>
    <div class="ornament-br"></div>
    <div class="panel-title">Account Login</div>
    <div class="field">
      <div class="label">Server</div>
      <div class="select"><span>Local rAthena · 127.0.0.1</span><i class="chev"></i></div>
    </div>
    <div class="field">
      <div class="label">Account</div>
      <div class="input"><span>testaccount</span></div>
    </div>
    <div class="field">
      <div class="label">Password</div>
      <div class="input"><span>••••••••••</span></div>
    </div>
    <div class="gold-btn wide">ENTER</div>
    <div class="check"><i></i> Remember account</div>
  </div>
  <div class="veil"></div>
  <div class="panel modal">
    <div class="ornament-bl"></div>
    <div class="ornament-br"></div>
    <div class="panel-title">Cannot Connect</div>
    <p>The selected server did not answer.<br>Check the address, then try again.</p>
    <div class="gold-btn wide">OK</div>
  </div>
</div>
</body>
</html>

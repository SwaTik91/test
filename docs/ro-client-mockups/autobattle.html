<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Goro — Auto Battle UI Mockup</title>
  <style>
    :root {
      --win-body: #ffffff;
      --title-top: #d6e8fa;
      --title-bot: #b8d6f2;
      --border: #769fcf;
      --footer: #f4f6f8;
      --footer-line: #aeb4bc;
      --panel: #fafcff;
      --btn: #ecf4fc;
      --btn-hover: #daebfa;
      --btn-down: #c6def5;
      --btn-border: #8aaed6;
      --text: #26303a;
      --title-text: #163658;
      --muted: #62707e;
      --input-focus: #528ac8;
      --ok: #2f7d4a;
      --warn: #b45309;
      --off: #8a939c;
      --auto-on: #1f7a3f;
      --auto-off: #5c6b7a;
      --slot: #e8eef6;
      --danger: #b42318;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "DejaVu Sans", "Segoe UI", Tahoma, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 20% 10%, #c8dde8 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, #a8c4b0 0%, transparent 45%),
        linear-gradient(180deg, #7ea0b8 0%, #5f7f6a 55%, #4a6a58 100%);
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px 16px 40px;
      gap: 20px;
    }

    .stage {
      width: min(960px, 100%);
      display: grid;
      gap: 16px;
    }

    .note {
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(22,54,88,.25);
      padding: 10px 14px;
      font-size: 13px;
      line-height: 1.45;
      color: var(--title-text);
    }
    .note strong { color: var(--text); }

    .game-frame {
      position: relative;
      height: 540px;
      border: 2px solid #2a3d4a;
      box-shadow: 0 18px 40px rgba(0,0,0,.28);
      background:
        linear-gradient(180deg, rgba(90,140,170,.35), rgba(40,70,55,.25)),
        repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(255,255,255,.04) 32px),
        repeating-linear-gradient(90deg, transparent, transparent 31px, rgba(255,255,255,.04) 32px),
        #6b8f78;
      overflow: hidden;
      user-select: none;
    }

    .fake-world {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .mob, .player {
      position: absolute;
      width: 28px;
      height: 40px;
      image-rendering: pixelated;
    }
    .player {
      left: 48%;
      top: 52%;
      background: linear-gradient(#f0d2a8, #c48a5a);
      border: 1px solid #5a4030;
      box-shadow: 0 0 0 2px rgba(255,255,255,.2);
    }
    .player::after {
      content: "You";
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      font-weight: 700;
      color: #ffe08a;
      text-shadow: 0 1px 0 #000;
      white-space: nowrap;
    }
    .mob {
      background: linear-gradient(#d8ecd0, #6a9a58);
      border: 1px solid #355530;
    }
    .mob.t1 { left: 62%; top: 40%; }
    .mob.t2 { left: 70%; top: 58%; }
    .mob.t3 { left: 38%; top: 36%; }
    .radius-ring {
      position: absolute;
      left: 48%;
      top: 52%;
      width: 220px;
      height: 220px;
      margin: -90px 0 0 -96px;
      border: 2px dashed rgba(255, 236, 140, .75);
      border-radius: 50%;
      opacity: 0;
      transition: opacity .2s;
    }
    .game-frame.auto-on .radius-ring { opacity: 1; }
    .game-frame.auto-on .player::after { content: "You  [AUTO]"; color: #9dffb0; }

    .badge-auto {
      position: absolute;
      top: 12px;
      right: 12px;
      min-width: 86px;
      text-align: center;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      border: 1px solid #2a3d4a;
      background: #dfe6ee;
      color: var(--auto-off);
    }
    .game-frame.auto-on .badge-auto {
      background: #d8f5e2;
      color: var(--auto-on);
      border-color: #1f7a3f;
    }

    /* RO window chrome */
    .ro-win {
      position: absolute;
      background: var(--win-body);
      border: 1px solid var(--border);
      box-shadow: 2px 2px 0 rgba(0,0,0,.18);
      display: flex;
      flex-direction: column;
      min-width: 200px;
    }
    .ro-title {
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px 0 8px;
      color: var(--title-text);
      font-size: 11px;
      font-weight: 700;
      background: linear-gradient(180deg, var(--title-top), var(--title-bot));
      border-bottom: 1px solid var(--border);
      cursor: move;
    }
    .ro-close {
      width: 14px;
      height: 14px;
      border: 1px solid var(--btn-border);
      background: var(--btn);
      color: var(--title-text);
      font-size: 10px;
      line-height: 12px;
      text-align: center;
      cursor: pointer;
      padding: 0;
    }
    .ro-close:hover { background: var(--btn-hover); }
    .ro-body {
      padding: 10px;
      background: var(--panel);
      flex: 1;
    }
    .ro-footer {
      border-top: 1px solid var(--footer-line);
      background: var(--footer);
      padding: 8px 10px;
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .ro-btn {
      border: 1px solid var(--btn-border);
      background: var(--btn);
      color: var(--text);
      font-size: 11px;
      padding: 4px 12px;
      cursor: pointer;
      min-width: 64px;
    }
    .ro-btn:hover { background: var(--btn-hover); }
    .ro-btn:active { background: var(--btn-down); }
    .ro-btn.primary {
      background: #d7ecff;
      border-color: var(--input-focus);
      font-weight: 700;
      color: var(--title-text);
    }
    .ro-btn.danger {
      color: var(--danger);
      border-color: #d9a39d;
      background: #fff1f0;
    }

    label.row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      margin-bottom: 8px;
      color: var(--text);
    }
    label.row span.hint {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 10px;
      margin-top: -4px;
    }
    input[type="range"] { width: 120px; }
    select, input[type="number"] {
      border: 1px solid var(--btn-border);
      background: #fff;
      color: var(--text);
      font-size: 11px;
      padding: 2px 4px;
      width: 88px;
    }
    .checks {
      display: grid;
      gap: 6px;
      margin: 8px 0 4px;
      font-size: 11px;
    }
    .checks label {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .skill-row {
      display: grid;
      grid-template-columns: repeat(4, 36px);
      gap: 6px;
      margin-top: 6px;
    }
    .skill-slot {
      width: 36px;
      height: 36px;
      border: 1px solid var(--btn-border);
      background:
        linear-gradient(135deg, #f7fbff, var(--slot));
      display: grid;
      place-items: center;
      font-size: 10px;
      color: var(--muted);
      cursor: pointer;
      position: relative;
    }
    .skill-slot.filled {
      color: var(--title-text);
      font-weight: 700;
      background: linear-gradient(180deg, #fff7d6, #f0d78a);
      border-color: #c9a227;
    }
    .skill-slot .n {
      position: absolute;
      right: 2px;
      bottom: 1px;
      font-size: 9px;
      color: #fff;
      text-shadow: 0 0 2px #000;
    }

    /* Basic info strip (classic-ish) */
    .basic-info {
      left: 12px;
      bottom: 56px;
      width: 176px;
    }
    .hpbar, .spbar {
      height: 10px;
      border: 1px solid #5a6a78;
      background: #1d2430;
      margin-top: 4px;
      overflow: hidden;
    }
    .hpbar > i { display:block; height:100%; width:72%; background: #d64545; }
    .spbar > i { display:block; height:100%; width:48%; background: #3b82f6; }
    .basic-info .name {
      font-size: 11px;
      font-weight: 700;
      color: var(--title-text);
      margin-bottom: 4px;
    }

    /* Hotbar */
    .hotbar {
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      padding: 6px;
      background: rgba(244,246,248,.94);
      border: 1px solid var(--border);
    }
    .hot-slot {
      width: 34px;
      height: 34px;
      border: 1px solid var(--btn-border);
      background: var(--slot);
      display: grid;
      place-items: center;
      font-size: 10px;
      color: var(--muted);
      cursor: pointer;
      position: relative;
    }
    .hot-slot .key {
      position: absolute;
      left: 2px;
      top: 1px;
      font-size: 8px;
      color: #314152;
    }
    .hot-slot.auto {
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--auto-off);
      background: linear-gradient(180deg, #eef3f8, #d5deea);
      border-color: #6f849c;
    }
    .hot-slot.auto.on {
      color: #fff;
      background: linear-gradient(180deg, #3bb86a, #1f7a3f);
      border-color: #145c2e;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.35);
    }
    .hot-slot.settings {
      color: var(--title-text);
      font-size: 14px;
    }

    /* Settings window */
    .settings-win {
      left: 50%;
      top: 56px;
      transform: translateX(-50%);
      width: 320px;
      z-index: 5;
      display: none;
    }
    .settings-win.open { display: flex; }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--title-text);
      margin: 2px 0 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid #d3dbe6;
    }

    .toast {
      position: absolute;
      left: 50%;
      top: 18px;
      transform: translateX(-50%);
      background: rgba(20,28,36,.88);
      color: #fff;
      font-size: 12px;
      padding: 6px 12px;
      border: 1px solid rgba(255,255,255,.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      z-index: 8;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="note">
      <strong>Макет Auto Battle (goro / RO style).</strong>
      Кнопка <strong>AUTO</strong> на хотбаре включает режим.
      Шестерёнка открывает окно настроек. Радиус показан пунктиром вокруг персонажа.
    </div>

    <div class="toolbar">
      <button class="ro-btn" type="button" id="btnDemoOn">Demo: включить AUTO</button>
      <button class="ro-btn" type="button" id="btnDemoOff">Demo: выключить (смерть)</button>
      <button class="ro-btn" type="button" id="btnOpenSettings">Открыть настройки</button>
    </div>

    <div class="game-frame" id="game">
      <div class="fake-world">
        <div class="radius-ring" id="radiusRing"></div>
        <div class="mob t1"></div>
        <div class="mob t2"></div>
        <div class="mob t3"></div>
        <div class="player"></div>
      </div>

      <div class="badge-auto" id="badge">AUTO OFF</div>
      <div class="toast" id="toast">Auto off: died</div>

      <!-- Basic info -->
      <div class="ro-win basic-info">
        <div class="ro-title"><span>Basic Info</span><button class="ro-close" type="button" tabindex="-1">×</button></div>
        <div class="ro-body">
          <div class="name">Novice · Base 50</div>
          <div style="font-size:10px;color:var(--muted)">HP</div>
          <div class="hpbar"><i></i></div>
          <div style="font-size:10px;color:var(--muted);margin-top:4px">SP</div>
          <div class="spbar"><i></i></div>
        </div>
      </div>

      <!-- Settings -->
      <div class="ro-win settings-win open" id="settings">
        <div class="ro-title">
          <span>Auto Battle Settings</span>
          <button class="ro-close" type="button" id="closeSettings">×</button>
        </div>
        <div class="ro-body">
          <div class="section-title">Combat</div>
          <label class="row">
            Search radius
            <input type="range" id="radius" min="5" max="15" value="10" />
            <span class="hint">Cells around character: <strong id="radiusVal">10</strong></span>
          </label>
          <label class="row">
            Skill rotation
            <span></span>
          </label>
          <div class="skill-row" title="MVP: ordinary attack + up to 3 skills">
            <div class="skill-slot filled" data-skill="ATK">ATK<span class="n">1</span></div>
            <div class="skill-slot filled" data-skill="Bash">Bsh<span class="n">2</span></div>
            <div class="skill-slot" data-skill="">+</div>
            <div class="skill-slot" data-skill="">+</div>
          </div>

          <div class="section-title" style="margin-top:12px">Survival</div>
          <label class="row">
            HP potion &lt;
            <input type="number" id="hpPot" min="1" max="99" value="50" />
          </label>
          <label class="row">
            SP potion &lt;
            <input type="number" id="spPot" min="1" max="99" value="30" />
          </label>

          <div class="section-title" style="margin-top:12px">Filters</div>
          <div class="checks">
            <label><input type="checkbox" id="loot" checked /> Auto loot</label>
            <label><input type="checkbox" id="ignoreMvp" checked /> Ignore MVP / mini-boss</label>
            <label><input type="checkbox" id="stopManual" checked /> Stop on manual move</label>
          </div>
        </div>
        <div class="ro-footer">
          <button class="ro-btn danger" type="button" id="btnStop">Stop</button>
          <button class="ro-btn" type="button" id="btnCancel">Cancel</button>
          <button class="ro-btn primary" type="button" id="btnApply">Apply</button>
        </div>
      </div>

      <!-- Hotbar -->
      <div class="ro-win hotbar" id="hotbar">
        <div class="hot-slot"><span class="key">F1</span>💊</div>
        <div class="hot-slot"><span class="key">F2</span>⚔</div>
        <div class="hot-slot"><span class="key">F3</span>✦</div>
        <div class="hot-slot auto" id="autoBtn" title="Toggle Auto Battle"><span class="key">F4</span>AUTO</div>
        <div class="hot-slot settings" id="settingsBtn" title="Auto Battle Settings">⚙</div>
      </div>
    </div>
  </div>

  <script>
    const game = document.getElementById("game");
    const badge = document.getElementById("badge");
    const autoBtn = document.getElementById("autoBtn");
    const settings = document.getElementById("settings");
    const toast = document.getElementById("toast");
    const radius = document.getElementById("radius");
    const radiusVal = document.getElementById("radiusVal");
    const radiusRing = document.getElementById("radiusRing");

    let autoOn = false;

    function showToast(text) {
      toast.textContent = text;
      toast.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function setAuto(on, reason) {
      autoOn = on;
      game.classList.toggle("auto-on", on);
      autoBtn.classList.toggle("on", on);
      badge.textContent = on ? "AUTO ON" : "AUTO OFF";
      if (!on && reason) showToast(reason);
      if (on) showToast("Auto Battle enabled");
    }

    function syncRadius() {
      const v = Number(radius.value);
      radiusVal.textContent = String(v);
      const px = 140 + (v - 5) * 12;
      radiusRing.style.width = px + "px";
      radiusRing.style.height = px + "px";
      radiusRing.style.marginLeft = -(px / 2 - 14) + "px";
      radiusRing.style.marginTop = -(px / 2 - 20) + "px";
    }

    autoBtn.addEventListener("click", () => setAuto(!autoOn));
    document.getElementById("settingsBtn").addEventListener("click", () => {
      settings.classList.add("open");
    });
    document.getElementById("closeSettings").addEventListener("click", () => {
      settings.classList.remove("open");
    });
    document.getElementById("btnCancel").addEventListener("click", () => {
      settings.classList.remove("open");
    });
    document.getElementById("btnApply").addEventListener("click", () => {
      syncRadius();
      settings.classList.remove("open");
      showToast("Settings applied");
    });
    document.getElementById("btnStop").addEventListener("click", () => {
      setAuto(false, "Auto off: stopped");
      settings.classList.remove("open");
    });
    document.getElementById("btnOpenSettings").addEventListener("click", () => {
      settings.classList.add("open");
    });
    document.getElementById("btnDemoOn").addEventListener("click", () => setAuto(true));
    document.getElementById("btnDemoOff").addEventListener("click", () => {
      setAuto(false, "Auto off: died");
    });
    radius.addEventListener("input", syncRadius);

    document.querySelectorAll(".skill-slot").forEach((slot, idx) => {
      if (idx === 0) return;
      slot.addEventListener("click", () => {
        if (slot.classList.contains("filled")) {
          slot.classList.remove("filled");
          slot.textContent = "+";
        } else {
          slot.classList.add("filled");
          slot.textContent = "Sk";
          const n = document.createElement("span");
          n.className = "n";
          n.textContent = String(idx + 1);
          slot.appendChild(n);
        }
      });
    });

    syncRadius();
  </script>
</body>
</html>
